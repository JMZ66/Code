name: bid-review-assistant

on:
  # Tag pushes have no file diff, so a paths filter would skip the release.
  push:
    branches:
      - main
    tags:
      - "bid-review-v*"
  pull_request:
    paths:
      - "bid_review_assistant/**"
      - ".github/workflows/bid-review-assistant.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bid-review-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: pytest (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bid_review_assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt libraries for offscreen tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libxcb-cursor0
      - name: Install Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build fixtures and run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          python scripts/build_fixture_pack.py
          python -m pytest tests -q --tb=short
          python -m bid_review.main --self-test -o "$RUNNER_TEMP/bid-selftest"

  test-windows:
    name: pytest (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bid_review_assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Record runner OS
        shell: pwsh
        run: |
          Write-Host "This runner is Windows Server, not desktop Windows 10 or 11."
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          python scripts/build_fixture_pack.py
          python -m pytest tests -q --tb=short

  package-windows:
    name: package and offline smoke (windows-latest)
    needs: [test-linux, test-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bid_review_assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable folder
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1
      - name: Require the desktop Qt plugin to be packaged
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse dist\BidReviewAssistant -Filter qwindows.dll
          if (-not $dll) { throw "qwindows.dll was not packaged; a desktop launch would fail." }
          Write-Host "Packaged:" $dll.FullName
      - name: Offscreen GUI probe of the built EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path dist\BidReviewAssistant\BidReviewAssistant.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList "--gui-probe" -PassThru -NoNewWindow -Wait
          if ($p.ExitCode -ne 0) { throw "gui-probe exit $($p.ExitCode)" }
      - name: Self-test the built EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\BidReviewAssistant\BidReviewAssistant.exe).Path
          $out = Join-Path $env:RUNNER_TEMP "bid-review-smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test","-o",$out) -PassThru -NoNewWindow -Wait
          if ($p.ExitCode -ne 0) { throw "self-test exit $($p.ExitCode)" }
      - name: Self-test again with outbound traffic blocked
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\BidReviewAssistant\BidReviewAssistant.exe).Path
          $rule = "bid-review-block-outbound-ci"
          $out = Join-Path $env:RUNNER_TEMP "bid-review-smoke-offline"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test","-o",$out) -PassThru -NoNewWindow -Wait
          $code = $p.ExitCode
          Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "offline self-test exit $code" }
          Write-Host "offline self-test passed under outbound block"
      - name: Zip portable package
        shell: pwsh
        run: |
          $ver = "1.0.0"
          $zip = Join-Path $env:RUNNER_TEMP "BidReviewAssistant-$ver-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\BidReviewAssistant\*" -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "zip=$zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BidReviewAssistant-windows-x64
          path: ${{ env.ZIP }}
      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/bid-review-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          name: 招投标文件审查助手 ${{ github.ref_name }}
          body: |
            Windows 便携版（只读·离线）。解压后运行 `BidReviewAssistant.exe`。
            详见 `bid_review_assistant/docs/使用说明.md`。
            注意：本资源在 GitHub windows-latest 上打包，不等于已在每台 Win10/11 桌面完成人工点验。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
