name: GCMS Release

on:
  push:
    tags:
      - "gcms-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gcms_knowledgebase/pyproject.toml
      - name: Install
        working-directory: gcms_knowledgebase
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Test
        working-directory: gcms_knowledgebase
        run: python -m pytest -q --tb=short
      - name: Build
        working-directory: gcms_knowledgebase
        run: python -m PyInstaller packaging/GCMS_KnowledgeBase.spec --noconfirm --clean
      - name: Add docs
        working-directory: gcms_knowledgebase
        shell: pwsh
        run: |
          $dest = "dist/GCMS_KnowledgeBase"
          Copy-Item README.md,使用说明.md,测试报告.md,兼容性说明.md,THIRD_PARTY_LICENSES.md $dest
          Copy-Item packaging/启动GCMS知识库.bat $dest
          Copy-Item -Recurse licenses $dest
      - name: Smoke test and offline probe
        working-directory: gcms_knowledgebase
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/smoke.ps1 -Exe (Resolve-Path dist/GCMS_KnowledgeBase/GCMS_KnowledgeBase.exe)
      - name: Optional installer
        working-directory: gcms_knowledgebase
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "未找到 ISCC.exe" }
          & $iscc.FullName packaging/installer.iss
      - name: Package assets
        shell: pwsh
        run: |
          Set-Location gcms_knowledgebase
          if (Test-Path dist/GCMS_KnowledgeBase-win64.zip) { Remove-Item dist/GCMS_KnowledgeBase-win64.zip }
          Compress-Archive -Path dist/GCMS_KnowledgeBase -DestinationPath dist/GCMS_KnowledgeBase-win64.zip
          Copy-Item README.md,使用说明.md,测试报告.md,兼容性说明.md,THIRD_PARTY_LICENSES.md dist
          Set-Location ..
          git archive --format=zip -o gcms_knowledgebase/dist/GCMS_KnowledgeBase-source.zip HEAD gcms_knowledgebase .github/workflows/gcms-knowledgebase.yml .github/workflows/gcms-release.yml
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          body_path: gcms_knowledgebase/packaging/release_notes.md
          files: |
            gcms_knowledgebase/dist/GCMS_KnowledgeBase-win64.zip
            gcms_knowledgebase/dist/GCMS_KnowledgeBase-source.zip
            gcms_knowledgebase/dist/GCMS_KnowledgeBase_Setup.exe
            gcms_knowledgebase/dist/使用说明.md
            gcms_knowledgebase/dist/测试报告.md
            gcms_knowledgebase/dist/兼容性说明.md
            gcms_knowledgebase/dist/THIRD_PARTY_LICENSES.md
            gcms_knowledgebase/dist/README.md
            gcms_knowledgebase/dist/GCMS_KnowledgeBase/offline-probe.txt
