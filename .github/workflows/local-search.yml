name: local-search

on:
  pull_request:
    paths:
      - "windows_fulltext_search/**"
      - ".github/workflows/local-search.yml"
  push:
    tags:
      - "local-search-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-search-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-linux:
    name: cargo test (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows_fulltext_search
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries for the UI build
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev
      - name: Test
        run: cargo test

  package-windows:
    name: package and self-test (windows-latest)
    runs-on: windows-latest
    needs: [test-linux]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows_fulltext_search
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record runner OS
        shell: pwsh
        run: |
          Write-Host "This runner is Windows Server, not desktop Windows 10 or 11."
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
      - name: Build release binaries
        run: cargo build --release
      - name: Assemble portable folder
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_windows.ps1
      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\LocalSearch\LocalSearch.exe).Path
          $report = Join-Path $env:RUNNER_TEMP "local-search-selftest.json"
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test-report", $report) -PassThru -Wait
          if (Test-Path $report) { Get-Content $report -Raw | Write-Host }
          if ($p.ExitCode -ne 0) { throw "self-test exit $($p.ExitCode)" }
      - name: GUI probe of the packaged exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\LocalSearch\LocalSearch.exe).Path
          $note = Join-Path (Get-Location) "windows-verification.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--gui-probe" -PassThru
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            "gui_probe=timed_out" | Set-Content $note
          } else {
            "gui_probe_exit=$($p.ExitCode)" | Set-Content $note
          }
          Add-Content $note "note=gui-probe is a process start on the CI runner, not an interactive Windows 11 mouse test."
          Add-Content $note "note=A non-zero exit is recorded and does not fail the build; this runner is not a desktop session."
          Get-Content $note
      - name: Self-test with outbound traffic blocked for this exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\LocalSearch\LocalSearch.exe).Path
          $os = Get-CimInstance Win32_OperatingSystem
          $result = Join-Path (Get-Location) "windows-verification.txt"
          $prior = @()
          if (Test-Path $result) { $prior = Get-Content $result }
          @(
            $prior
            "runner_caption=$($os.Caption)"
            "runner_version=$($os.Version)"
            "runner_build=$($os.BuildNumber)"
            "note=GitHub-hosted windows-latest is Windows Server, not desktop Windows 10 or 11."
            "note=No interactive mouse test on Windows 10 or 11 was performed."
            "note=The executable is not code-signed."
            "note=GUI probe is a process start, not an offscreen desktop session proof."
            "selftest_before_firewall=passed"
          ) | Set-Content $result -Encoding utf8
          $rule = "localsearch-block-outbound-ci"
          Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
          Add-Content $result "firewall_rule=outbound block for this exe only"
          $report = Join-Path $env:RUNNER_TEMP "local-search-firewall.json"
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test-report", $report) -PassThru -Wait
          if (Test-Path $report) { Get-Content $report -Raw | Write-Host }
          Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "firewall self-test exit $($p.ExitCode)" }
          Add-Content $result "selftest_during_firewall=passed"
      - name: Hash the zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          $hash = Get-FileHash $zip.FullName -Algorithm SHA256
          "$($hash.Hash)  $($zip.Name)" | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSearch-windows-x64
          path: |
            windows_fulltext_search/dist/*.zip
            windows_fulltext_search/dist/SHA256SUMS.txt
            windows_fulltext_search/windows-verification.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/local-search-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          $sums = "dist\SHA256SUMS.txt"
          gh release create $tag $zip.FullName $sums --title "本地全文搜索 $tag" --notes-file docs/release-notes.md
