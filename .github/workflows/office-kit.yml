name: office-kit

on:
  pull_request:
    paths:
      - "office-kit/**"
      - ".github/workflows/office-kit.yml"
  push:
    paths:
      - "office-kit/**"
      - ".github/workflows/office-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: office-kit
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
