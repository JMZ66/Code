[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidreview"
version = "1.0.0"
description = "离线、只读的招投标文件审查助手"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "lxml>=5",
  "openpyxl>=3.1",
  "pypdf>=4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "python-docx>=1.1",
  "reportlab>=4",
]

[project.scripts]
bidreview = "bidreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
