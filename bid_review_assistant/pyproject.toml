[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-review-assistant"
version = "1.0.0"
description = "Windows 离线中文招投标文件格式与一致性审查助手（只读）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JMZ66" }]
dependencies = [
  "python-docx>=1.1.0",
  "openpyxl>=3.1.2",
  "pypdf>=4.0.0",
  "lxml>=5.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "reportlab>=4.0", "pyinstaller>=6.0"]
gui = []

[project.scripts]
bid-review = "bid_review.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
