[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-review-assistant"
version = "1.0.1"
description = "Windows offline Chinese tender document format and consistency review assistant (read-only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "python-docx>=1.1.0",
  "lxml>=5.0.0",
  "openpyxl>=3.1.2",
  "pypdf>=4.0.0",
  "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pyinstaller>=6.3.0",
]

[project.scripts]
bid-review = "bid_review.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
