[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chem-warehouse"
version = "1.0.0"
description = "Windows offline hazardous chemical warehouse management for analytical labs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6.0",
  "openpyxl>=3.1.2",
  "reportlab>=4.0.0",
  "qrcode[pil]>=7.4.2",
  "Pillow>=10.0.0",
]

[project.scripts]
chem-warehouse = "chem_wh.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
